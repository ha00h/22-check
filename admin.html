<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>22 체크 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="hd"><h1 class="logo">22 <b>체크</b> 관리자</h1><div class="date">의견 게시판</div></header>

  <form class="card" id="login" style="margin-top:120px" novalidate hidden>
    <h2 class="h2">🔒 관리자 로그인</h2>
    <label for="key">비밀키 <span class="req">*</span></label>
    <input class="in" id="key" type="password" placeholder="비밀키를 입력하세요" autocomplete="current-password">
    <div class="msg err" id="loginErr" hidden></div>
    <button class="btn" id="loginBtn" type="submit" style="margin-top:12px">입장</button>
  </form>

  <section id="list" hidden>
    <div class="card"><h2 class="h2">받은 의견 <span class="badge" id="count">0</span></h2><div id="items"></div></div>
    <button class="btn sec" id="logout" type="button" style="margin-top:16px">로그아웃</button>
  </section>

  <section class="card center" id="blocked" hidden>
    <div class="icon">⛔</div><h2 class="h2">접근이 차단되었어요</h2>
    <p>비밀키를 여러 번 잘못 입력했어요.<br><span id="blockedWait">15분 후 다시 시도할 수 있어요.</span></p>
    <div class="msg err">상태: 차단됨</div>
    <button class="btn sec" id="blockedBack" type="button" style="margin-top:12px">로그인 화면으로</button>
  </section>

  <section class="card center" id="off" hidden>
    <div class="icon">🔌</div><h2 class="h2">서버 꺼짐</h2>
    <p>지금은 서버가 꺼져 있어 의견을 불러올 수 없어요.<br>잠시 후 다시 시도해 주세요.</p>
    <p class="note" style="margin-top:8px">관리자 서버는 Tailscale 네트워크에 연결된 기기에서만 열려요.</p>
    <div class="msg warn">상태: 서버 꺼짐</div>
    <button class="btn" id="retry" type="button" style="margin-top:12px">다시 시도</button>
  </section>
</div>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
